# Runs on every pull request and on pushes to main and dev: formatting,
# vet and the tests with the race detector on Linux, plus a build and the
# tests on Windows, so a platform-only break (like the locale paths) shows
# up before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

# a newer push to the same branch or PR cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Tests (race detector)
        run: go test -race ./...

      - name: Tests of the phone app's JavaScript
        run: node --test internal/web/jstest/queue.test.cjs

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Tests
        run: go test ./...
