version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/queries"
    schema: "internal/db/schema"
    gen:
      go:
        package: "database"
        out: "internal/db/out"
        overrides:
          - column: "todos.history_since"
            go_type: "database/sql.NullString"
          - column: "todos_history.date"
            go_type: "string"
